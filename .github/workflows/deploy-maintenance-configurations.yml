name: Deploy maintenance configurations

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-maintenance-configurations.yml'
  workflow_dispatch:
    inputs:
      resource_group:
        description: Resource group for the maintenance configurations
        required: true
        type: string
      location:
        description: Azure region for the resource group and configurations
        required: true
        type: string
      time_zone:
        description: Schedule time zone, for example UTC
        required: true
        default: UTC
        type: string
      start_date:
        description: Schedule start date in YYYY-MM-DD format
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep templates
        run: |
          az bicep build --file infra/maintenance-configurations.bicep --stdout > /dev/null
          az bicep build --file infra/policy-assignment.bicep --stdout > /dev/null

  plan:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      LOCATION: ${{ inputs.location }}
      TIME_ZONE: ${{ inputs.time_zone }}
      START_DATE: ${{ inputs.start_date }}
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check resource group exists
        run: az group show --name "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" --output none
      - name: Validate schedule start date
        run: |
          if [[ ! "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'Schedule start date must use YYYY-MM-DD format.'
            exit 1
          fi
      - name: Review deployment changes
        run: >-
          az deployment group what-if
          --name "maintenance-configurations-${GITHUB_RUN_ID}"
          --resource-group "$RESOURCE_GROUP"
          --subscription "$AZURE_SUBSCRIPTION_ID"
          --template-file infra/maintenance-configurations.bicep
          --parameters location="$LOCATION" timeZone="$TIME_ZONE" startDate="$START_DATE"

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      LOCATION: ${{ inputs.location }}
      TIME_ZONE: ${{ inputs.time_zone }}
      START_DATE: ${{ inputs.start_date }}
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy maintenance configurations
        run: >-
          az deployment group create
          --name "maintenance-configurations-${GITHUB_RUN_ID}"
          --resource-group "$RESOURCE_GROUP"
          --subscription "$AZURE_SUBSCRIPTION_ID"
          --template-file infra/maintenance-configurations.bicep
          --parameters location="$LOCATION" timeZone="$TIME_ZONE" startDate="$START_DATE"